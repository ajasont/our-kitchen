<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Kitchen</title>
<meta name="description" content="Home cooking, sorted by cuisine.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f4ef; --surface:#ebe8e2; --ink:#1b1b1a; --muted:#64635e; --line:rgba(27,27,26,.14);
    --stone:url(marble-light.jpg); --veil:rgba(246,244,239,.32);
    --u:8px; --gap:calc(var(--u)*2); --max:1152px; --cols:4;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#1d1d1c;--surface:#262624;--ink:#efeeea;--muted:#a6a59f;--line:rgba(239,238,234,.16);
      --stone:url(marble-dark.jpg);--veil:rgba(29,29,28,.28)}
  }
  *{box-sizing:border-box}
  html{background:var(--bg)}
  body{background:linear-gradient(var(--veil),var(--veil)),var(--stone) 0 0/1024px 1024px repeat,var(--bg);
    background-attachment:fixed}
  html,body{margin:0;color:var(--ink);
    font:400 15px/1.6 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
  button{font:inherit;color:inherit}
  .wrap{max-width:var(--max);margin:0 auto;padding:0 calc(var(--u)*3)}
  .label{font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

  /* Header: centered, three equal stat columns */
  header.wrap{text-align:center;padding-top:calc(var(--u)*10);padding-bottom:calc(var(--u)*6)}
  h1{font-size:32px;font-weight:600;letter-spacing:-.01em;line-height:1.2;margin:calc(var(--u)*1.5) 0 0}
  .sub{max-width:480px;margin:calc(var(--u)*1.5) auto 0;color:var(--muted)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);max-width:480px;margin:calc(var(--u)*5) auto 0;
    border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .stat{padding:calc(var(--u)*2) 0}
  .stat + .stat{border-left:1px solid var(--line)}
  .stat b{display:block;font-size:20px;font-weight:600;line-height:1.3}

  /* Nav: centered text links, one rule above and below */
  nav{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 84%,transparent);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  nav .wrap{display:flex;flex-wrap:wrap;justify-content:center;gap:0 calc(var(--u)*3)}
  .tab{background:none;border:0;padding:calc(var(--u)*1.75) 0;cursor:pointer;font-size:13px;font-weight:500;
    color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
  .tab:hover{color:var(--ink)}
  .tab[aria-current=true]{color:var(--ink);border-bottom-color:var(--ink)}
  .tab:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  /* Sections */
  section{padding:calc(var(--u)*8) 0 0}
  .head{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:var(--gap);
    padding-bottom:calc(var(--u)*2);margin-bottom:calc(var(--u)*3);border-bottom:1px solid var(--line)}
  .head .l{justify-self:start}.head .r{justify-self:end}
  h2{font-size:20px;font-weight:600;margin:0;text-align:center;line-height:1.3}
  .back{background:none;border:0;padding:0;cursor:pointer}
  .back:hover{color:var(--ink)}

  /* One grid for everything */
  .grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:calc(var(--u)*4) var(--gap)}
  .grid.even{display:flex;flex-wrap:wrap;justify-content:center}
  .grid.even > .item{width:calc((100% - (var(--cols) - 1) * var(--gap)) / var(--cols))}
  .item{display:block;width:100%;background:none;border:0;padding:0;text-align:left;cursor:pointer}
  .item:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
  .frame{aspect-ratio:1/1;overflow:hidden;background:var(--surface)}
  .frame img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .2s}
  .item:hover img{opacity:.88}
  .cap{display:flex;justify-content:space-between;gap:var(--u);margin-top:var(--u);font-size:13px}
  .cap span:last-child{color:var(--muted)}
  .item.cat .cap{display:block;text-align:center;margin-top:calc(var(--u)*1.5)}
  .item.cat .cap b{display:block;font-weight:500;font-size:14px}
  .item.cat .cap span{color:var(--muted);font-size:12px}

  .more{display:block;margin:calc(var(--u)*6) auto 0;background:none;border:1px solid var(--ink);
    padding:calc(var(--u)*1.25) calc(var(--u)*4);cursor:pointer;font-size:13px;font-weight:500}
  .more:hover{background:var(--ink);color:var(--bg)}
  footer.wrap{text-align:center;padding-top:calc(var(--u)*10);padding-bottom:calc(var(--u)*6)}

  /* Lightbox */
  .lb{position:fixed;inset:0;background:var(--bg);display:none;z-index:20;
    grid-template-rows:auto 1fr auto;padding:calc(var(--u)*3)}
  .lb.open{display:grid}
  .lb-top,.lb-bot{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
  .lb-top .r{justify-self:end}
  .lb-stage{display:flex;align-items:center;justify-content:center;min-height:0;padding:calc(var(--u)*3) 0}
  .lb-stage img{max-width:100%;max-height:100%;object-fit:contain}
  .lb-bot{justify-items:center}
  .lb-bot .l{justify-self:start}.lb-bot .r{justify-self:end}
  .lb button{background:none;border:0;cursor:pointer;padding:var(--u);font-size:13px;font-weight:500}
  .lb button:hover{color:var(--muted)}

  @media (max-width:960px){:root{--cols:3}}
  @media (hover:none){body{background-attachment:scroll}}
  @media (max-width:640px){
    :root{--cols:2;--gap:12px}
    header.wrap{padding-top:calc(var(--u)*6)}
    nav .wrap{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;scrollbar-width:none}
    nav .wrap::-webkit-scrollbar{display:none}
  }
</style>
</head>
<body>
<header class="wrap">
  <div class="label">Home cooking</div>
  <h1 id="title">Our Kitchen</h1>
  <p class="sub" id="subtitle"></p>
  <div class="stats" id="stats"></div>
</header>
<nav aria-label="Sections"><div class="wrap" id="tabs"></div></nav>
<main class="wrap" id="main"></main>
<footer class="wrap label" id="foot"></footer>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <div class="lb-top"><span class="label" id="lb-cat"></span><span></span><button class="r" id="lb-x">Close</button></div>
  <div class="lb-stage"><img id="lb-img" alt=""></div>
  <div class="lb-bot"><button class="l" id="lb-prev">&larr; Previous</button><span class="label" id="lb-cap"></span><button class="r" id="lb-next">Next &rarr;</button></div>
</div>

<script src="data.js"></script>
<script>
(function(){
  const K = window.KITCHEN;
  const $ = s => document.querySelector(s);
  const cats = K.categories.map(c => ({...c, dishes: K.dishes.filter(d => d.cat === c.code)})).filter(c => c.dishes.length);
  const byCode = Object.fromEntries(cats.map(c => [c.code, c]));
  const fmt = d => new Date(d + "T12:00:00").toLocaleDateString(undefined, {month:"short", year:"numeric"});
  const thumb = u => "thumbs/" + u + ".jpg", photo = u => "photos/" + u + ".jpg";
  const nPhotos = K.dishes.reduce((a, d) => a + d.photos.length, 0);
  const plural = (n, w) => n.toLocaleString() + " " + w + (n === 1 ? "" : "s");

  document.title = K.title;
  $("#title").textContent = K.title;
  $("#subtitle").textContent = K.subtitle;
  $("#stats").innerHTML = [[K.dishes.length, "Dishes"], [nPhotos, "Photos"], [cats.length, "Sections"]]
    .map(([b, s]) => `<div class="stat"><b>${b.toLocaleString()}</b><span class="label">${s}</span></div>`).join("");
  $("#foot").textContent = "Made at home · Updated " + K.updated;

  let current = "all";
  function tabs(){
    $("#tabs").innerHTML = `<button class="tab" data-c="all" aria-current="${current==='all'}">All</button>` +
      cats.map(c => `<button class="tab" data-c="${c.code}" aria-current="${current===c.code}">${c.name}</button>`).join("");
    const a = $("#tabs .tab[aria-current=true]"), w = $("#tabs");
    if (a && w.scrollWidth > w.clientWidth) w.scrollLeft = a.offsetLeft - (w.clientWidth - a.offsetWidth) / 2;
  }
  $("#tabs").addEventListener("click", e => { const b = e.target.closest(".tab"); if (b) go(b.dataset.c); });

  const head = (title, left, right) =>
    `<div class="head"><span class="l">${left || ""}</span><h2>${title}</h2><span class="r label">${right || ""}</span></div>`;

  function dishItem(d){
    const n = d.photos.length;
    return `<button class="item" data-d="${K.dishes.indexOf(d)}" aria-label="${byCode[d.cat].name}, ${fmt(d.date)}${n>1?`, ${n} photos`:''}">
      <div class="frame"><img loading="lazy" src="${thumb(d.photos[0])}" alt=""></div>
      <div class="cap"><span>${fmt(d.date)}</span><span>${n > 1 ? n + " photos" : ""}</span></div></button>`;
  }

  function home(){
    const latest = K.dishes.slice(0, 8);
    $("#main").innerHTML = `
      <section>${head("Latest", "", "")}<div class="grid">${latest.map(dishItem).join("")}</div></section>
      <section>${head("Sections", "", "")}<div class="grid even">${cats.map(c => `
        <button class="item cat" data-c="${c.code}">
          <div class="frame"><img loading="lazy" src="${thumb(c.dishes[0].photos[0])}" alt=""></div>
          <div class="cap"><b>${c.name}</b><span>${plural(c.dishes.length, "dish").replace("dishs","dishes")}</span></div>
        </button>`).join("")}</div></section>`;
  }

  const PAGE = 48;
  function category(code){
    const c = byCode[code]; let shown = PAGE;
    const render = () => {
      $("#main").innerHTML = `<section>${head(c.name, `<button class="back label" data-c="all">&larr; All</button>`,
          plural(c.dishes.length, "dish").replace("dishs","dishes"))}
        <div class="grid">${c.dishes.slice(0, shown).map(dishItem).join("")}</div>
        ${shown < c.dishes.length ? `<button class="more" id="more">Show more</button>` : ""}</section>`;
      const m = $("#more"); if (m) m.onclick = () => { shown += PAGE; render(); };
    };
    render();
  }

  function go(code, push = true){
    current = byCode[code] ? code : "all";
    tabs();
    current === "all" ? home() : category(current);
    if (push) {
      history.pushState(null, "", current === "all" ? location.pathname : "#" + current);
      const h = document.querySelector("header"), top = h.offsetTop + h.offsetHeight;
      if (window.scrollY > top) window.scrollTo({top});
    }
  }
  window.addEventListener("popstate", () => go(location.hash.slice(1), false));

  $("#main").addEventListener("click", e => {
    const t = e.target.closest(".item[data-d]"); if (t) return openLb(+t.dataset.d);
    const c = e.target.closest("[data-c]"); if (c) go(c.dataset.c);
  });

  // Lightbox
  let lbD = null, lbI = 0, lastFocus = null;
  function show(){
    const d = K.dishes[lbD], many = d.photos.length > 1;
    $("#lb-img").src = photo(d.photos[lbI]);
    $("#lb-img").alt = byCode[d.cat].name;
    $("#lb-cat").textContent = byCode[d.cat].name;
    $("#lb-cap").textContent = fmt(d.date) + (many ? ` · ${lbI + 1} / ${d.photos.length}` : "");
    $("#lb-prev").style.visibility = $("#lb-next").style.visibility = many ? "visible" : "hidden";
  }
  function openLb(i){ lastFocus = document.activeElement; lbD = i; lbI = 0; show(); $("#lb").classList.add("open"); document.body.style.overflow = "hidden"; $("#lb-x").focus(); }
  function closeLb(){ $("#lb").classList.remove("open"); document.body.style.overflow = ""; lbD = null; if (lastFocus) lastFocus.focus(); }
  function step(n){ const d = K.dishes[lbD]; lbI = (lbI + n + d.photos.length) % d.photos.length; show(); }
  $("#lb-x").onclick = closeLb; $("#lb-prev").onclick = () => step(-1); $("#lb-next").onclick = () => step(1);
  document.addEventListener("keydown", e => {
    if (lbD === null) return;
    if (e.key === "Escape") closeLb(); else if (e.key === "ArrowLeft") step(-1); else if (e.key === "ArrowRight") step(1);
  });
  let sx = null;
  $("#lb").addEventListener("touchstart", e => sx = e.touches[0].clientX, {passive: true});
  $("#lb").addEventListener("touchend", e => { if (sx === null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 40) step(dx < 0 ? 1 : -1); sx = null; });

  go(location.hash.slice(1), false);
})();
</script>
</body>
</html>
